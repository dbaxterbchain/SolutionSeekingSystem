title: Flexibility
order: 11
icon: "🌿"
tagline: >-
  Adapting your approach to new information without abandoning your core values.
whatItIs: >-
  Flexibility is the ability to adapt your approach, perspective, or plan in response
  to new information, changing conditions, or unexpected challenges, without abandoning
  your core values.
howUsed: >-
  Flexibility keeps the Communication Protocol responsive and effective. In Mutual
  Understanding it allows you to adjust your assumptions as you hear new perspectives.
  In Solution Seeking, it helps generate creative, practical solutions that may differ
  from your initial ideas but better serve all participants.
bestPractices:
  - Listen openly to alternative ideas before making a decision.
  - Treat unexpected changes as opportunities to reassess and improve.
  - Distinguish between core principles (non-negotiable) and methods (adaptable).
  - When possible, design solutions that can be adjusted if circumstances shift.
  - Model adaptability so others feel safe suggesting changes.
goals:
  - Prevent stagnation by encouraging innovation and responsiveness.
  - Ensure solutions stay relevant and workable over time.
  - Reduce conflict caused by rigid adherence to outdated plans.
  - Support collaboration by showing willingness to meet others halfway.
antigoals:
  - Changing direction so often that no one can rely on your commitments.
  - Using flexibility as an excuse to avoid making decisions.
  - Abandoning values or agreements at the first sign of difficulty.
  - Adapting to accommodate harmful or unethical behavior.
practices:
  - title: Pivot Test
    body: 'Ask yourself, "If I had to change this plan tomorrow, what would remain essential?"'
  - title: Option Mapping
    body: >-
      In brainstorming, identify at least three possible paths forward instead of defaulting to one.
  - title: Check-in Loop
    body: >-
      Build scheduled reviews into long-term solutions to see if adjustments are needed.
faq:
  - q: How do I stay flexible without seeming inconsistent?
    a: >-
      Communicate why you're changing course and show how the new approach still aligns
      with your values.
  - q: What if flexibility is seen as a weakness?
    a: >-
      Frame adaptability as strength — being able to change without losing your
      principles is resilience, not weakness.
example: >-
  A café changes suppliers to cut costs, but quality drops. Instead of insisting on the
  new supplier, the team reevaluates and negotiates a partial return to the old
  supplier for key items. The final approach balances quality, cost, and customer
  satisfaction.
