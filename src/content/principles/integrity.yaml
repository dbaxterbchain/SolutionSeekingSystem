title: Integrity (Consistency)
order: 10
icon: "🧭"
illustration: ../../assets/principles/integrity.webp
illustrationAlt: "Two people with hands on their hearts before a lighthouse, above signposts reading values, words, and actions, illustrating Integrity."
tagline: >-
  Aligning your actions, words, and values, reliably, over time.
whatItIs: >-
  Integrity is the alignment of your actions, words, and values. It means doing what
  you say you will do, acting honestly, and making decisions that reflect your stated
  principles. Consistency is the practice of applying this alignment over time so that
  others can reliably predict your behavior based on your values.
howUsed: >-
  Integrity is the trust anchor of the Communication Protocol. It gives weight to your
  commitments during Solution Seeking and credibility to your perspective in Mutual
  Understanding. Consistency ensures that fairness, good faith, and other principles
  are not one-time gestures but an ongoing standard.
bestPractices:
  - Follow through on promises or communicate immediately if you can't.
  - Apply the same standards to yourself that you expect from others.
  - Be honest, even when it's uncomfortable or inconvenient.
  - Admit mistakes quickly and take corrective action.
  - Ensure your decisions and actions reflect the values you claim to hold.
goals:
  - Build trust through reliability and honesty.
  - Provide a stable foundation for collaboration and leadership.
  - Reduce misunderstandings caused by unpredictable or contradictory behavior.
  - Model the behaviors you expect in others.
antigoals:
  - Acting according to convenience instead of principle.
  - Saying one thing and doing another.
  - Being so rigid in "consistency" that you refuse to adapt when new information emerges.
  - Using integrity as a weapon to shame others rather than to guide your own behavior.
practices:
  - title: Commitment Log
    body: Track promises you make and follow up on them regularly.
  - title: Values Check
    body: 'Before acting, ask: "Does this match what I''ve said I stand for?"'
  - title: Self-Application Drill
    body: Review your own behavior for consistency with the rules you enforce.
faq:
  - q: What if keeping my word would cause harm I didn't foresee?
    a: >-
      Integrity includes being honest about changing course when necessary; explain the
      change, why it's needed, and how you'll repair any impact.
  - q: Can consistency ever become a problem?
    a: >-
      Yes, if it turns into inflexibility. True integrity includes adapting while
      staying true to your core values.
example: >-
  A leader promises to review scheduling feedback before the next month's calendar.
  When they realize they can't meet the deadline, they inform the team in advance,
  explain the delay, and commit to a new timeline. The proactive honesty maintains
  trust despite the change.
