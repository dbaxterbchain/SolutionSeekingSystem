title: Compassion and Empathy
order: 5
illustration: ../../assets/principles/compassion-empathy.webp
illustrationAlt: "A person in warm light reaching toward someone standing in a storm, illustrating Compassion and Empathy."
tagline: >-
  Caring for others and connecting with their experience so you can see the human behind the behavior.
whatItIs: >-
  Compassion is the commitment to act with care toward others, especially when they
  are struggling, even if you don't fully agree with them. Empathy is the ability to
  understand and emotionally connect with someone else's experience, either through
  shared experience (emotional empathy) or perspective-taking (cognitive empathy).
  Together, they allow you to see the humanity in others and respond in ways that
  protect dignity and foster trust.
howUsed: >-
  Compassion and Empathy are essential for every stage of the Communication Protocol.
  In Introspection, they help you soften judgment toward yourself and others. In
  Mutual Understanding, they help you hear what's beneath someone's words or behavior.
  In Solution Seeking, they ensure outcomes consider emotional and relational needs,
  not just logistical ones.
bestPractices:
  - Listen without interrupting, especially when emotions are high.
  - >-
    Show understanding verbally ("I can see why that would be frustrating") and
    nonverbally (eye contact, open posture).
  - Ask open-ended questions that invite deeper sharing.
  - Acknowledge pain or struggle before trying to solve the problem.
  - When offering feedback, lead with care and clarity, not criticism.
goals:
  - Build trust and rapport even in disagreement.
  - Ensure people feel valued beyond their role or performance.
  - Reduce defensiveness by showing you see and respect the other person's perspective.
  - Create solutions that meet both practical and human needs.
antigoals:
  - Using empathy to manipulate emotions or gain an advantage.
  - Becoming so emotionally absorbed that you can't think critically about the problem.
  - Overpromising out of compassion, leading to unrealistic expectations.
  - Assuming you know how someone feels without asking.
practices:
  - title: Emotion Paraphrasing
    body: >-
      After hearing someone's concern, restate both the content and the emotion you believe they're expressing.
  - title: Pause Before Problem-Solving
    body: >-
      Give at least 60 seconds after someone shares a struggle before offering a solution.
  - title: "\"Imagine Being Them\" Drill"
    body: >-
      In conflict preparation, write down what the other person might be feeling and fearing.
faq:
  - q: What if I don't actually feel empathy toward them?
    a: >-
      You can still act with compassion by choosing to treat them with care, even
      without an emotional connection.
  - q: Can empathy ever make things worse?
    a: >-
      Yes, if it leads to overidentifying with the other person to the point where you
      can't stay objective. Pair empathy with boundaries.
example: >-
  A barista repeatedly arrives late. Instead of jumping to discipline, the manager
  uses empathy to learn that the employee's bus route was changed, adding 20 minutes
  to their commute. Together, they adjust the schedule to start 30 minutes later. The
  problem is solved, and the relationship stays intact.
