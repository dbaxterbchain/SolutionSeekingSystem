title: Humility (and Understanding Pride)
order: 4
icon: "🙇"
illustration: ../../assets/principles/humility.webp
illustrationAlt: "One person reaching out from an open bridge toward another closed off inside a stone tower, illustrating Humility and the pull of pride."
tagline: >-
  Recognizing the limits of your own perspective, and noticing when Pride blocks collaboration.
whatItIs: >-
  Humility is the recognition that your perspective, knowledge, and abilities are
  limited, and that others have valuable insights you may lack. It is the willingness
  to learn, admit mistakes, and give credit where it's due. Understanding Pride means
  acknowledging the human desire for dignity, recognition, and self-worth, and
  noticing when that desire becomes a barrier to listening or collaborating.
howUsed: >-
  Humility makes Mutual Understanding possible. It allows you to genuinely consider
  another's perspective and accept that your own view may be incomplete. Recognizing
  Pride helps you identify when defensiveness or ego is getting in the way of
  solution-seeking. Together, they create a balance between self-respect and openness
  to change.
bestPractices:
  - Admit when you don't know something or when you've made a mistake.
  - Give full credit for others' contributions.
  - Ask questions with the intention of learning, not confirming your own beliefs.
  - Reflect on moments when Pride might be pushing you to defend your image over finding the truth.
  - Choose curiosity over winning.
goals:
  - Foster openness to new ideas and perspectives.
  - Reduce defensiveness during conflict resolution.
  - Strengthen team relationships by valuing all contributions.
  - Build a culture where learning is prioritized over ego.
antigoals:
  - False humility (pretending to be unsure just to appear agreeable).
  - Using humility as an excuse to withdraw from responsibility or leadership.
  - Allowing Pride to shut down productive dialogue.
  - Equating humility with lack of self-worth.
practices:
  - title: Ego Check Pause
    body: 'When feeling defensive, ask yourself: "Am I protecting my point or my pride?"'
  - title: Contribution Highlight
    body: >-
      In group work, name at least one thing each person added that improved the result.
  - title: Learning Posture Drill
    body: >-
      Begin at least one meeting per week by stating something you've recently learned from a teammate.
faq:
  - q: How can I balance humility with confidence?
    a: >-
      Humility doesn't mean devaluing yourself; it means knowing your worth while
      remaining open to others' input.
  - q: How do I know if Pride is getting in the way?
    a: >-
      Notice if you're feeling the need to "win," correct minor details unnecessarily,
      or prove you're right at the expense of progress.
example: >-
  Two leaders disagree about a new workflow. One feels strongly their plan is
  superior, but after practicing humility, they invite feedback and learn the other's
  approach addresses a compliance issue they had overlooked. Pride could have led to
  conflict; humility led to a hybrid solution that satisfied both.
