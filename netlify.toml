# @supabase/supabase-js requires Node 22+ (native WebSocket) as of v2.
[build.environment]
  NODE_VERSION = "22"

# Astro fingerprints everything under /_astro/, so it can be cached forever.
[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# White-label custom domain: assistant.bchain.coffee serves the Beanchain
# "baristas-assistant" page. Root-only + Host-scoped on purpose: a /* catch-all
# would swallow /_astro/* and /api/* on the alias and break assets, chat, and
# auth; the Host condition keeps it off solutionseeking.com entirely.
[[redirects]]
  from = "/"
  to = "/a/ecb52ef5-3b83-4f50-912d-d94725f89e28/baristas-assistant"
  status = 200
  force = true
  conditions = { Host = ["assistant.bchain.coffee"] }

# Pings IndexNow (Bing/Yandex) with all sitemap URLs after production deploys.
[[plugins]]
  package = "./netlify/plugins/indexnow"
