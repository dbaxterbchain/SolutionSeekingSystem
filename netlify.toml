# @supabase/supabase-js requires Node 22+ (native WebSocket) as of v2.
[build.environment]
  NODE_VERSION = "22"

# Astro fingerprints everything under /_astro/, so it can be cached forever.
[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# NOTE: white-label custom domains are no longer routed here. They run on Cloudflare
# for SaaS (a router Worker + KV map host -> page); assistant.bchain.coffee was cut over
# on 2026-07-23. See docs/deployment.md "White-label pages & custom domains".

# Pings IndexNow (Bing/Yandex) with all sitemap URLs after production deploys.
[[plugins]]
  package = "./netlify/plugins/indexnow"
