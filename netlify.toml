# @supabase/supabase-js requires Node 22+ (native WebSocket) as of v2.
[build.environment]
  NODE_VERSION = "22"

# Astro fingerprints everything under /_astro/, so it can be cached forever.
[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# White-label custom domain: assistant.bchain.coffee serves the Beanchain
# "baristas-assistant" page. The host lives in `from` (a full URL) because that
# is how Netlify matches a domain - `conditions = { Host = ... }` is NOT a
# supported condition and is silently ignored. Root-only on purpose: a `/*`
# splat would swallow /_astro/* and /api/* on the alias and break assets, chat,
# and auth. Scoped to the alias host, so solutionseeking.com is untouched.
[[redirects]]
  from = "https://assistant.bchain.coffee/"
  to = "/a/ecb52ef5-3b83-4f50-912d-d94725f89e28/baristas-assistant"
  status = 200
  force = true

# Pings IndexNow (Bing/Yandex) with all sitemap URLs after production deploys.
[[plugins]]
  package = "./netlify/plugins/indexnow"
